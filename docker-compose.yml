services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: api-raupulus-app
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-raupulus_api}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_STORE=${CACHE_STORE:-redis}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - SESSION_DRIVER=${SESSION_DRIVER:-redis}
      - REDIS_HOST=${REDIS_HOST:-redis}
    volumes:
      - ${STORAGE_VOLUME:-./storage}:/var/www/storage
      - .:/var/www
      - /var/www/vendor
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-raupulus-network

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: api-raupulus-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ${STORAGE_VOLUME:-./storage}:/var/www/storage
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    networks:
      - api-raupulus-network

  postgres:
    image: postgres:17-alpine
    container_name: api-raupulus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-raupulus_api}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-raupulus-network

  redis:
    image: redis:7-alpine
    container_name: api-raupulus-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - api-raupulus-network

  reverb:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: api-raupulus-reverb
    profiles: ["reverb"]
    restart: unless-stopped
    command: ["php", "/var/www/artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-raupulus_api}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=${REDIS_HOST:-redis}
    volumes:
      - ${STORAGE_VOLUME:-./storage}:/var/www/storage
      - .:/var/www
      - /var/www/vendor
    ports:
      - "${REVERB_SERVER_PORT:-8080}:8080"
    mem_limit: 256m
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - api-raupulus-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  api-raupulus-network:
    driver: bridge
