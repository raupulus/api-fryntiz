    <!-- Script del Motor de FAQs optimizado -->
    <script>
        var datosFaqs = [];

        // 1. Descargar el JSON local de forma asíncrona
        $.getJSON('json/faqs.json', function(data) {
            datosFaqs = data;
            renderizar(""); // Pintar todo al cargar la página
        }).fail(function() {
            console.error("No se pudo cargar el archivo faqs.json");
        });

        // 2. Pintar los bloques usando h3 y paneles clásicos de tu plantilla
        function renderizar(filtro) {
            var $contenedor = $('#contenedorCategorias');
            $contenedor.empty();
            var totalVisibles = 0;
            var htmlFinal = "";

            datosFaqs.forEach(function(cat, catIdx) {
                var preguntasHtml = "";
                var cuentaPreguntas = 0;

                cat.preguntas.forEach(function(faq) {
                    var dePregunta = faq.pregunta.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    var deRespuesta = faq.respuesta.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

                    if (filtro === "" || dePregunta.indexOf(filtro) !== -1 || deRespuesta.indexOf(filtro) !== -1) {
                        cuentaPreguntas++;
                        totalVisibles++;

                        // Estructura adaptada: El título usa <h3> <B> idéntico a tu ejemplo para mantener consistencia visual
                        preguntasHtml += 
                            '<div class="panel panel-default item-faq" style="margin-bottom: 15px; border-radius: 4px; border: 1px solid #ddd;">' +
                                '<div class="panel-heading" style="cursor: pointer; padding: 15px;" data-toggle="collapse" data-target="#collapse-' + faq.id + '">' +
                                    '<h3 class="panel-title" style="margin: 0; font-size: 18px;">' +
                                        '<B>' + faq.pregunta + '</B>' +
                                    '</h3>' +
                                '</div>' +
                                '<div id="collapse-' + faq.id + '" class="panel-collapse collapse">' +
                                    '<div class="panel-body text-muted" style="padding: 15px; line-height: 1.6; font-size: 14px;">' + faq.respuesta + '</div>' +
                                '</div>' +
                            '</div>';
                    }
                });

                if (cuentaPreguntas > 0) {
                    // El título de la categoría actúa como separador estilizado
                    htmlFinal += '<div class="bloque-categoria" style="margin-bottom: 40px; margin-top: 20px;">' +
                        '<h2 style="border-bottom: 2px solid #4875b9; padding-bottom: 8px; margin-bottom: 25px; color: #4875b9; font-weight: bold;">' + cat.categoria + '</h2>' +
                        '<div class="panel-group" id="acordeon-' + catIdx + '">' + preguntasHtml + '</div>' +
                    '</div>';
                }
            });

            $contenedor.append(htmlFinal);

            if (totalVisibles === 0 && filtro !== "") {
                $('#sinResultados').show();
            } else {
                $('#sinResultados').hide();
            }
        }

        // 3. Buscador reactivo ultra rápido
        $('#buscadorFaq').on('input', function() {
            var termino = $(this).val().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            renderizar(termino);
        });
    </script>
