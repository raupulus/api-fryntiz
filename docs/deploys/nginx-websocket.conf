#
# Sitio virtual del servidor de WebSockets (Laravel Reverb).
#
# El demonio escucha en 127.0.0.1:8080 y NO se expone: aquí delante va nginx con
# el certificado. Ver docs/deploys/websockets-reverb.md.
#
# Instalación:
#   sudo cp docs/deploys/nginx-websocket.conf /etc/nginx/sites-available/ws.raupulus.dev
#   sudo ln -s /etc/nginx/sites-available/ws.raupulus.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#

server {
    listen 80;
    listen [::]:80;
    server_name ws.raupulus.dev;

    # Certbot deja aquí su comprobación; el resto va a TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ws.raupulus.dev;

    ssl_certificate     /etc/letsencrypt/live/ws.raupulus.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.raupulus.dev/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/ws.raupulus.dev.access.log;
    error_log  /var/log/nginx/ws.raupulus.dev.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sin estas dos cabeceras la conexión nunca llega a ser un WebSocket:
        # se queda en una petición HTTP normal y el cliente reintenta sin parar.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Un WebSocket está abierto horas. Con el minuto por defecto de nginx se
        # corta solo y el navegador entra en un bucle de reconexión.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # El demonio ya trocea sus propios mensajes; no hace falta almacenarlos
        # aquí y sí estorba a la latencia.
        proxy_buffering off;
    }
}
