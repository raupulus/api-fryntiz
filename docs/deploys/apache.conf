<VirtualHost *:80>
    ServerName api.raupulus.dev
    DocumentRoot /var/www/api-raupulus/public

    <Directory /var/www/api-raupulus/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Assets estáticos con caché
    <LocationMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
        Header set Cache-Control "public, immutable"
    </LocationMatch>

    # PHP-FPM
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/var/run/php/php8.4-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    # Seguridad
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    # Tamaño máximo de subida
    LimitRequestBody 52428800

    ErrorLog ${APACHE_LOG_DIR}/api-raupulus-error.log
    CustomLog ${APACHE_LOG_DIR}/api-raupulus-access.log combined
</VirtualHost>
