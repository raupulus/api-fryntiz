# ============================================================================
#  Api Raupulus — sitio virtual de Apache para DESARROLLO local
#
#  Sin TLS y sin HSTS a propósito: `Strict-Transport-Security` sobre un dominio
#  local deja el navegador marcándolo como «sólo HTTPS» durante un año, y luego
#  hay que ir a limpiarlo a mano en la configuración del navegador. El
#  middleware de la aplicación tampoco la manda si la petición no es segura.
#
#  Copiar a /etc/apache2/sites-available/api-fryntiz.local.conf y añadir
#  `127.0.0.1  api-fryntiz.local` a /etc/hosts.
# ============================================================================

<VirtualHost *:80>
    ServerName api-fryntiz.local

    ServerAdmin webmaster@localhost

    # ⚠️ `public/`, no la raíz del proyecto. La versión anterior de este fichero
    # apuntaba a /var/www/public/api-fryntiz, o sea a la raíz del repositorio:
    # eso deja `.env`, `storage/` y `vendor/` accesibles por HTTP.
    DocumentRoot /var/www/api-fryntiz/public

    <Directory /var/www/api-fryntiz/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . index.php [L]
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog  ${APACHE_LOG_DIR}/api-fryntiz.local_error.log
    CustomLog ${APACHE_LOG_DIR}/api-fryntiz.local_access.log combined
</VirtualHost>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
