# ============================================================================
#  Api Raupulus — sitio virtual de Apache (producción)
#
#  Es el que está en uso hoy en el VPS. Copiar a:
#      /etc/apache2/sites-available/api.raupulus.dev.conf
#      a2ensite api.raupulus.dev && systemctl reload apache2
#
#  Módulos necesarios:
#      a2enmod rewrite headers ssl proxy proxy_http proxy_wstunnel
#
#  Las cabeceras de seguridad las pone TAMBIÉN la aplicación
#  (App\Http\Middleware\SecurityHeaders), así que la API está protegida aunque
#  este fichero se despliegue mal. Se repiten aquí para que las mande el
#  servidor incluso cuando PHP no llega a ejecutarse (un 502, el modo
#  mantenimiento, un fichero estático).
# ============================================================================

<VirtualHost *:80>
    ServerName api.raupulus.dev
    ServerAlias www.api.raupulus.dev

    # Todo a HTTPS. Este vhost NO sirve la aplicación: sólo redirige.
    Redirect permanent / https://api.raupulus.dev/

    ErrorLog ${APACHE_LOG_DIR}/api.raupulus.dev_error.log
    CustomLog ${APACHE_LOG_DIR}/api.raupulus.dev_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName api.raupulus.dev
    ServerAdmin public@raupulus.dev

    # ⚠️ El `www` va en su propio vhost de redirección, MÁS ABAJO.
    #
    # La versión anterior de este fichero tenía `ServerAlias www.` aquí y a la
    # vez un `Redirect permanent / https://api.raupulus.dev/` dentro de este
    # mismo bloque :443. Eso es un BUCLE DE REDIRECCIÓN: el vhost que sirve el
    # sitio se redirigía a sí mismo, así que por HTTPS no respondía nada.

    DocumentRoot /var/www/api-fryntiz/public

    <Directory /var/www/api-fryntiz/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . index.php [L]
    </Directory>

    # Nada por debajo de public/ es accesible, y los ocultos tampoco.
    <DirectoryMatch "/var/www/api-fryntiz/(app|bootstrap|config|database|resources|routes|storage|tests|vendor)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # ── Cabeceras de seguridad ──────────────────────────────────────────────
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Header always set Strict-Transport-Security "max-age=31536000"

    # Lo que anuncia PHP. El `expose_php = Off` del php.ini es lo definitivo.
    Header always unset X-Powered-By
    Header always unset Server

    # ── WebSockets (Reverb) ─────────────────────────────────────────────────
    #
    # Sólo si BROADCAST_CONNECTION=reverb. Apagado de fábrica.
    #
    # El puerto es el 8080 (REVERB_SERVER_PORT), no el 6001: la versión anterior
    # de este fichero apuntaba al 6001, que es el de Laravel WebSockets, un
    # paquete que este proyecto no usa.
    #
    # ProxyPreserveHost hace falta para que Reverb valide bien el origen.
    ProxyPreserveHost On
    ProxyPass        "/app/"  "ws://127.0.0.1:8080/app/"
    ProxyPassReverse "/app/"  "ws://127.0.0.1:8080/app/"
    ProxyPass        "/apps/" "http://127.0.0.1:8080/apps/"
    ProxyPassReverse "/apps/" "http://127.0.0.1:8080/apps/"

    # ── TLS ─────────────────────────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/api.raupulus.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.raupulus.dev/privkey.pem

    # Tamaño de subida: el panel admite hasta 20 MB por fichero (File::MAX_FILE_SIZE).
    LimitRequestBody 52428800

    ErrorLog  ${APACHE_LOG_DIR}/api.raupulus.dev_error-ssl.log
    CustomLog ${APACHE_LOG_DIR}/api.raupulus.dev_access-ssl.log combined
</VirtualHost>

# El `www` redirige al dominio sin `www`, en su propio vhost para no chocar con
# el que sirve el sitio.
<VirtualHost *:443>
    ServerName www.api.raupulus.dev

    Redirect permanent / https://api.raupulus.dev/

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/api.raupulus.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.raupulus.dev/privkey.pem
</VirtualHost>

