# ============================================================================
#  Api Raupulus — sitio virtual de nginx (producción)
#
#  Alternativa a Apache, lista para el día que se cambie. Copiar a:
#      /etc/nginx/sites-available/api.raupulus.dev
#      ln -s ../sites-available/api.raupulus.dev /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#
#  Las cabeceras de seguridad las pone TAMBIÉN la aplicación
#  (App\Http\Middleware\SecurityHeaders). Se repiten aquí para que las mande el
#  servidor aunque PHP no llegue a ejecutarse.
#
#  ⚠️ En nginx, `add_header` NO se hereda en un `location` que declare sus
#  propios `add_header`: los del bloque padre se descartan enteros. Por eso el
#  location de estáticos repite las suyas en vez de poner sólo el Cache-Control.
#  Es el fallo silencioso clásico de este fichero.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.raupulus.dev www.api.raupulus.dev;

    # Certbot necesita llegar aquí sin redirección.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://api.raupulus.dev$request_uri;
    }
}

# El `www` a su sitio.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.api.raupulus.dev;

    ssl_certificate     /etc/letsencrypt/live/api.raupulus.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.raupulus.dev/privkey.pem;

    return 301 https://api.raupulus.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.raupulus.dev;

    root /var/www/api-fryntiz/public;
    index index.php;
    charset utf-8;

    # ── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.raupulus.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.raupulus.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Cabeceras de seguridad ──────────────────────────────────────────────
    #
    # `always` para que salgan también en las respuestas de error, que es
    # justo cuando más falta hacen.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;

    # El panel admite ficheros de hasta 20 MB (File::MAX_FILE_SIZE); el margen
    # es para la sobrecarga del multipart.
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Repetidas a propósito: ver la nota de la cabecera del fichero.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Nada oculto, salvo lo que pide Certbot.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
