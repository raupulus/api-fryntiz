# ============================================================================
#  Api Raupulus — nginx dentro de Docker
#
#  ⚠️ Este fichero es una COPIA DE REFERENCIA. El que se construye en la imagen
#  es `docker/nginx/default.conf`, porque el Dockerfile lo copia desde ahí:
#
#      COPY docker/nginx/default.conf /etc/nginx/conf.d/default.conf
#
#  Si tocas uno, toca el otro. Se mantiene aquí para que los tres sitios
#  virtuales del proyecto —Apache, nginx y Docker— se puedan comparar de un
#  vistazo en el mismo directorio, que es de lo que iba la auditoría AR-D01:
#  había cuatro configuraciones repartidas y ninguna declarada como la buena.
#
#  Sin TLS: dentro del contenedor no hay certificados. Delante va el nginx o el
#  Apache del host, que es quien termina TLS y quien manda HSTS.
# ============================================================================

server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # `add_header` no se hereda en un location que declare los suyos.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
