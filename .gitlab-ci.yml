# Pipeline CI/CD para GitLab — Api Raupulus
stages:
  - quality
  - test

variables:
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: raupulus_api_test
  DB_USERNAME: postgres
  DB_PASSWORD: secret
  POSTGRES_DB: raupulus_api_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: secret

quality-and-test:
  stage: test
  image: php:8.4-cli-alpine
  services:
    - name: postgres:17-alpine
      alias: postgres
  before_script:
    - apk add --no-cache git unzip curl nodejs npm libpq-dev libpng-dev libjpeg-turbo-dev freetype-dev libwebp-dev icu-dev libxml2-dev oniguruma-dev libzip-dev imagemagick imagemagick-heic $PHPIZE_DEPS imagemagick-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp
    - docker-php-ext-install pdo pdo_pgsql pgsql gd intl mbstring xml bcmath zip
    - pecl install imagick && docker-php-ext-enable imagick
    - corepack enable && corepack prepare pnpm@11.7.0 --activate
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cp .env.example .env
    - php -r "file_put_contents('.env', str_replace(['DB_DATABASE=raupulus_api', 'DB_USERNAME=postgres', 'DB_PASSWORD='], ['DB_DATABASE=raupulus_api_test', 'DB_USERNAME=postgres', 'DB_PASSWORD=secret'], file_get_contents('.env')));"
    - composer install --no-interaction --prefer-dist --no-progress
    - php artisan key:generate --force
    - pnpm install --frozen-lockfile
  script:
    - ./vendor/bin/pint --test
    - composer phpstan
    - pnpm build
    - composer audit
    - pnpm audit --prod
    - php artisan route:cache && php artisan route:clear
    - php artisan test --compact
